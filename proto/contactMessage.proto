syntax = "proto3";

package contactMessage;

service ContactMessageService {
  rpc AddContactMessage (AddContactMessageRequest) returns (AddContactMessageResponse);
  rpc GetContactMessage (GetContactMessageRequest) returns (GetContactMessageResponse);
  rpc ListContactMessages (ListContactMessagesRequest) returns (ListContactMessagesResponse);
  rpc UpdateContactMessage (UpdateContactMessageRequest) returns (UpdateContactMessageResponse);
  rpc DeleteContactMessage (DeleteContactMessageRequest) returns (DeleteContactMessageResponse);
}


message AddContactMessageRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string subject = 4;
  string message = 5;
}

message AddContactMessageResponse {
  string statusMessage = 1;
}


message GetContactMessageRequest {
  int32 id = 1;
}

message GetContactMessageResponse {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string subject = 5;
  string message = 6;
  bool isRead = 7;
}

message ListContactMessagesRequest {}

message ListContactMessagesResponse {
  repeated GetContactMessageResponse contactMessages = 1;
}


message UpdateContactMessageRequest {
  int32 id = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string subject = 5;
  string message = 6;
  bool isRead = 7;
}

message UpdateContactMessageResponse {
  string statusMessage = 1;
}


message DeleteContactMessageRequest {
  int32 id = 1;
}

message DeleteContactMessageResponse {
  string statusMessage = 1;
}
