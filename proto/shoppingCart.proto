syntax = "proto3";

package shoppingCart;

service ShoppingCartService {
  rpc AddShoppingCart (AddShoppingCartRequest) returns (AddShoppingCartResponse);
  rpc GetShoppingCart (GetShoppingCartRequest) returns (GetShoppingCartResponse);
  rpc ListShoppingCart (ListShoppingCartRequest) returns (ListShoppingCartResponse);
  rpc UpdateShoppingCart (UpdateShoppingCartRequest) returns (UpdateShoppingCartResponse);
  rpc DeleteShoppingCart (DeleteShoppingCartRequest) returns (DeleteShoppingCartResponse);
}


message AddShoppingCartRequest {
  int32 userId = 1;
  int32 partId = 2;
}

message AddShoppingCartResponse {
  string statusMessage = 1;
}


message GetShoppingCartRequest {
  int32 id = 1;
}

message GetShoppingCartResponse {
  int32 id = 1;
  int32 userId = 2;
  int32 partId = 3;
  int32 quantity = 4;
}

message ListShoppingCartRequest {}

message ListShoppingCartResponse {
  repeated GetShoppingCartResponse shoppingCart = 1;
}


message UpdateShoppingCartRequest {
  int32 id = 1;
  int32 userId = 2;
  int32 partId = 3;
  int32 quantity = 4;
}

message UpdateShoppingCartResponse {
  string statusMessage = 1;
}


message DeleteShoppingCartRequest {
  int32 id = 1;
}

message DeleteShoppingCartResponse {
  string statusMessage = 1;
}
