syntax = "proto3";

package user;

service UserService {
  rpc AddUser (AddUserRequest) returns (AddUserResponse);
}

message AddUserRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string phone = 4;
  string nationalCode = 5;
  string password = 6;
}

message AddUserResponse {
  string statusMessage = 1;
}