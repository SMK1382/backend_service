syntax = "proto3";

package user;

service UserService {
  rpc AddUser (ListUsersRequest) returns (UserList);
}

message AddUserRequest {
  string firstName = 1;
  string lastName = 2;
  string email = 3;
  string phone = 4;
  string nationalCode = 5;
  string password = 6;
}

message UserResponse {
  int32 id = 1;
  string name = 2;
  string email = 3;
}

message ListUsersRequest {}

message UserList {
  repeated UserResponse users = 1;
}